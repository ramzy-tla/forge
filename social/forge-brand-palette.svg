<svg width="1080" height="1400" viewBox="0 0 1080 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Forge Technologies — Brand Colour Palette</title>
<desc id="d">The Forge Technologies brand colours: Forge Blue #2563EB, Signal Gold #F5A623, Midnight Navy #0A1020, Ink #0F172A, Paper White #FFFFFF, and the signature blue-indigo-cyan gradient.</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(8 .5 .5)">
<stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#101a34"/><stop offset="1" stop-color="#0a1020"/>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
</defs>
<rect width="1080" height="1400" fill="url(#bg)"/>
<circle cx="1040" cy="60" r="260" fill="url(#brand)" opacity=".14" filter="url(#glow)"/>
<text x="90" y="108" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="28" font-weight="700" letter-spacing="6"><tspan fill="#3b82f6">// </tspan><tspan fill="#e6edff">FORGE TECHNOLOGIES</tspan></text>
<text x="90" y="184" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="66" font-weight="800" fill="#ffffff">Brand Colours</text>
<rect x="92" y="204" width="120" height="6" rx="3" fill="#f5a623"/>

<g font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
<!-- row 1 -->
<rect x="90" y="270" width="150" height="150" rx="20" fill="#2563EB" stroke="#ffffff" stroke-opacity=".12"/>
<text x="282" y="336" font-size="42" font-weight="700" fill="#ffffff">Forge Blue</text>
<text x="282" y="378" font-size="26" fill="#93a4c0" font-family="Inter,system-ui,sans-serif">Primary · links, buttons, focus</text>
<text x="990" y="360" text-anchor="end" font-size="40" font-weight="700" letter-spacing="1" fill="#e6edf5" font-family="Inter,system-ui,monospace">#2563EB</text>
<!-- row 2 -->
<rect x="90" y="444" width="150" height="150" rx="20" fill="#F5A623" stroke="#ffffff" stroke-opacity=".12"/>
<text x="282" y="510" font-size="42" font-weight="700" fill="#ffffff">Signal Gold</text>
<text x="282" y="552" font-size="26" fill="#93a4c0" font-family="Inter,system-ui,sans-serif">Accent · highlights, eyebrows</text>
<text x="990" y="534" text-anchor="end" font-size="40" font-weight="700" letter-spacing="1" fill="#e6edf5" font-family="Inter,system-ui,monospace">#F5A623</text>
<!-- row 3 -->
<rect x="90" y="618" width="150" height="150" rx="20" fill="#0A1020" stroke="#ffffff" stroke-opacity=".18"/>
<text x="282" y="684" font-size="42" font-weight="700" fill="#ffffff">Midnight Navy</text>
<text x="282" y="726" font-size="26" fill="#93a4c0" font-family="Inter,system-ui,sans-serif">Base · hero &amp; dark sections</text>
<text x="990" y="708" text-anchor="end" font-size="40" font-weight="700" letter-spacing="1" fill="#e6edf5" font-family="Inter,system-ui,monospace">#0A1020</text>
<!-- row 4 -->
<rect x="90" y="792" width="150" height="150" rx="20" fill="#0F172A" stroke="#ffffff" stroke-opacity=".18"/>
<text x="282" y="858" font-size="42" font-weight="700" fill="#ffffff">Ink</text>
<text x="282" y="900" font-size="26" fill="#93a4c0" font-family="Inter,system-ui,sans-serif">Surfaces · deep text, cards</text>
<text x="990" y="882" text-anchor="end" font-size="40" font-weight="700" letter-spacing="1" fill="#e6edf5" font-family="Inter,system-ui,monospace">#0F172A</text>
<!-- row 5 -->
<rect x="90" y="966" width="150" height="150" rx="20" fill="#FFFFFF" stroke="#ffffff" stroke-opacity=".2"/>
<text x="282" y="1032" font-size="42" font-weight="700" fill="#ffffff">Paper White</text>
<text x="282" y="1074" font-size="26" fill="#93a4c0" font-family="Inter,system-ui,sans-serif">Text on dark · negative space</text>
<text x="990" y="1056" text-anchor="end" font-size="40" font-weight="700" letter-spacing="1" fill="#e6edf5" font-family="Inter,system-ui,monospace">#FFFFFF</text>
</g>

<!-- signature gradient -->
<rect x="90" y="1176" width="900" height="92" rx="18" fill="url(#brand)"/>
<text x="116" y="1233" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Signature Gradient</text>
<text x="964" y="1233" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="26" fill="#ffffff" opacity=".9">115°</text>
<text x="90" y="1312" font-family="Inter,system-ui,monospace" font-size="26" fill="#93a4c0">#3B82F6&#160;&#160;→&#160;&#160;#6366F1&#160;&#160;→&#160;&#160;#22D3EE</text>

<line x1="90" y1="1348" x2="990" y2="1348" stroke="#22304f" stroke-width="2"/>
<text x="90" y="1388" font-family="Inter,system-ui,sans-serif" font-size="25" fill="#7c8aa5">Headings: Plus Jakarta Sans&#160;&#160;·&#160;&#160;Body: Inter</text>
<text x="990" y="1388" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="25" letter-spacing="2" fill="#64748b">FORGETECHNE.COM</text>
</svg>
