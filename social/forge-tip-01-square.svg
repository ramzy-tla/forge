<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Growth Tip 01 — The 4 questions every business must answer</title>
<desc id="d">Branded content card listing the four questions: who are you for, what do customers want, why choose you, what do you promise.</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#101a34"/><stop offset="1" stop-color="#0a1020"/>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
</defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<circle cx="1030" cy="60" r="280" fill="url(#brand)" opacity=".16" filter="url(#glow)"/>
<text x="90" y="140" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="30" font-weight="700" letter-spacing="5"><tspan fill="#3b82f6">// </tspan><tspan fill="#f5a623">GROWTH TIP 01</tspan></text>
<text x="90" y="270" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="72" font-weight="800" fill="#ffffff">4 questions every</text>
<text x="90" y="352" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="72" font-weight="800" fill="#ffffff">business must answer</text>
<text x="92" y="418" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="32" fill="#94a3b8">before spending another cedi on marketing.</text>
<g font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
<circle cx="140" cy="540" r="40" fill="url(#brand)"/><text x="140" y="556" text-anchor="middle" font-size="40" font-weight="800" fill="#0a1020">1</text>
<text x="210" y="556" font-size="42" font-weight="600" fill="#e8eef8">Who are you for?</text>
<circle cx="140" cy="660" r="40" fill="url(#brand)"/><text x="140" y="676" text-anchor="middle" font-size="40" font-weight="800" fill="#0a1020">2</text>
<text x="210" y="676" font-size="42" font-weight="600" fill="#e8eef8">What do they really want?</text>
<circle cx="140" cy="780" r="40" fill="url(#brand)"/><text x="140" y="796" text-anchor="middle" font-size="40" font-weight="800" fill="#0a1020">3</text>
<text x="210" y="796" font-size="42" font-weight="600" fill="#e8eef8">Why should they choose you?</text>
<circle cx="140" cy="900" r="40" fill="url(#brand)"/><text x="140" y="916" text-anchor="middle" font-size="40" font-weight="800" fill="#0a1020">4</text>
<text x="210" y="916" font-size="42" font-weight="600" fill="#e8eef8">What do you promise?</text>
</g>
<line x1="90" y1="990" x2="990" y2="990" stroke="#22304f" stroke-width="2"/>
<text x="90" y="1040" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="27" font-weight="700" letter-spacing="3"><tspan fill="#3b82f6">// </tspan><tspan fill="#e6edff">FORGE TECHNOLOGIES</tspan></text>
<text x="990" y="1040" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="26" fill="#64748b">Full guide → forgetechne.com/blog</text>
</svg>
